[package]
name = "vrchat-logger"
version = "0.1.0"
edition = "2024"

[features]
debug = []


[dependencies]
#other misc
thiserror = "2.0.20"
once_cell = "1"
log = "0.4"
simple_logger = "5"
dotenvy = "0.15.7"

#http & ws requests
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "cookies"]} #http requests
reqwest_cookie_store = "0.10"
cookie_store = "0.22"
url = "2"
tower = {version = "0.5.3", features = ["limit", "timeout"]}
futures = "0.3"
http = "1"
tokio = {version = "1", features = ["full"]}
tokio-websockets = { version = "0.13", features = ["client", "rustls-webpki-roots", "ring", "rand"] }

#serialisation + additional types
serde = { version = "1", features = ["rc"] }
serde_derive = "1"
serde_with = { version = "3" , features = ["json"]}
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }


vrchatapi = { version = "=1.20.9", default-features = false, features = ["rustls"]}
serenity = {version = "0.12.5", git="https://github.com/serenity-rs/serenity.git", branch="next", default-features = false, features = ["gateway", "cache", "rustls_backend"]}
